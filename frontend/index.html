<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius Royale</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>

    <div id="screen-login" class="screen active">
        <div class="login-container">
            <img src="images/logo.jpeg" alt="Genius Royale Logo" class="app-logo">
            <div class="login-box">
                <h2>Iniciar Sesión</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Usuario / Email</label>
                        <input type="text" id="username" name="username" placeholder="Introduce tu usuario">
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Introduce tu contraseña">
                    </div>
                    <button type="submit" class="btn-login">Entrar</button>
                </form>
                <div class="login-footer">
                    <p>¿No tienes cuenta? <a href="#" id="link-to-register">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-register" class="screen hidden">
        <div class="login-container">
            <img src="images/logo.jpeg" alt="Genius Royale Logo" class="app-logo">
            <div class="login-box">
                <h2>Crear Cuenta</h2>
                <form id="register-form">
                    <div class="input-group">
                        <label for="reg-username">Usuario</label>
                        <input type="text" id="reg-username" placeholder="Elige un nombre" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="Tu correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" placeholder="Crea una contraseña" required>
                    </div>
                    <button type="submit" class="btn-login btn-primary">Registrarse</button>
                </form>
                <div class="login-footer">
                    <p>¿Ya tienes cuenta? <a href="#" id="link-to-login">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-menu" class="screen hidden">
        <!-- Menú lateral -->
        <div class="sidebar">
            <div class="profile-section">
                <img id="profile-picture" src="images/default-profile.png" alt="Foto de perfil" class="profile-picture">
                <h2 id="display-username">JugadorSimulado</h2>
            </div>
            <div class="stats-section hidden" id="stats-section">
                <h3>📊 Estadísticas</h3>
                <p>Partidas jugadas: <span id="stats-games-played">0</span></p>
                <p>Partidas ganadas: <span id="stats-games-won">0</span></p>
                <p>Puntaje total: <span id="stats-total-score">0</span></p>
            </div>
            <button id="btn-logout" class="btn-menu btn-secondary">Cerrar Sesión</button>
        </div>

        <!-- Contenido principal -->
        <div class="menu-content">
            <h1 class="app-title">Genius Royale</h1>
            <div class="menu-buttons">
                <button id="btn-public-game" class="btn-menu btn-primary">⚔️ Partida Pública</button>
                <button id="btn-private-game" class="btn-menu btn-secondary">🛡️ Partida Privada</button>
                <button id="btn-add-friend" class="btn-menu btn-info">➕ Añadir Amigo</button>
            </div>
        </div>
    </div>

    <!-- Modal para estadísticas del usuario -->
    <div id="stats-modal" class="hidden">
        <div class="modal-content">
            <h2>📊 Tus Estadísticas</h2>
            <p>Partidas jugadas: <span id="stats-games-played">0</span></p>
            <p>Partidas ganadas: <span id="stats-games-won">0</span></p>
            <p>Puntaje total: <span id="stats-total-score">0</span></p>
            <button id="close-stats" class="btn-menu btn-secondary">Cerrar</button>
        </div>
    </div>

    <div id="screen-game" class="screen hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <script src="js/app.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
