<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Genius Royale</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>

    <div id="screen-login" class="screen active">
        <div class="login-container">
            <div class="login-box">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Pass" required>
                    <button type="submit" class="btn-login">Entrar</button>
                </form>
            </div>
        </div>
    </div>

    <div id="screen-menu" class="screen hidden" style="display: none;">
        <div class="sidebar">
            <h2 id="display-username">Usuario</h2>
            <button id="btn-requests" class="btn-menu">📬 Solicitudes</button>
            <button id="btn-logout" class="btn-menu">Salir</button>
        </div>
        <div class="menu-content">
            <h1>Genius Royale</h1>
            <button id="btn-private-game" class="btn-menu btn-primary">🛡️ Partida Privada</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen hidden" style="display: none;">
        <div class="lobby-container">
            <div class="panel">
                <h2>Sala de Espera</h2>
                <div id="lobby-players-container" style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin: 20px 0;">
                    <p>Jugadores en la sala:</p>
                    <ul id="lobby-players-list" style="list-style: none; font-size: 1.2rem; font-weight: bold; color: #FFD700;">
                        </ul>
                </div>
                
                <div class="config-row">
                    <label>Categoría:</label>
                    <select id="game-category"><option>Cultura General</option></select>
                </div>

                <div id="host-controls" style="display: none; margin-top: 20px;">
                    <button id="btn-start-game-final" class="btn-primary" style="background: #4CAF50; padding: 15px 30px;">🚀 INICIAR PARTIDA</button>
                </div>
                
                <p id="waiting-msg" style="font-style: italic; color: #ccc;">Esperando a que se una tu oponente...</p>
                
                <hr>
                <h3>Tus Amigos</h3>
                <ul id="friends-list" class="styled-list"></ul>
                <button id="btn-leave-lobby" class="btn-secondary">Volver</button>
            </div>
        </div>
    </div>

    <div id="screen-game" class="screen hidden" style="display: none; background: #2D0A4E; height: 100vh; width: 100vw; position: fixed; top:0; left:0;">
        <div id="game-content" style="text-align: center; padding-top: 20vh;">
            <h1 style="color: #FFD700; font-size: 3rem;">¡DUELO INICIADO!</h1>
            <p id="opponent-name" style="font-size: 1.5rem;"></p>
        </div>
    </div>

    <div id="requests-modal" class="hidden"><div class="modal-content"><ul id="requests-list"></ul><button id="close-requests">Cerrar</button></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
